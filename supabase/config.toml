# ============================================================
# Supabase CLI configuration — AgriConnect Nepal
# Used by GitHub Actions to deploy edge functions
# ============================================================
project_id = "farm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "52428800"

[auth]
enabled = true

[functions]
enabled = true
verify_jwt = false

[analytics]
enabled = false
