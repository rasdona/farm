<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Friends - Ekrishi Nepal</title>
  <meta name="description" content="Connect with workers and farmers across Nepal. Add friends, accept requests, and chat like Messenger.">
  <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>
  <main style="margin-top:var(--navbar-height);padding:24px 0;min-height:80vh">
    <div class="container" style="max-width:900px">
      <div class="section-header">
        <h2>🤝 Friends</h2>
        <p>Connect with farmers and workers, then chat like Messenger</p>
      </div>

      <div class="card mb-4">
        <div class="card-body" style="display:flex;gap:10px">
          <input type="text" id="friendSearchInput" class="form-input" placeholder="Search people by name or district..." style="flex:1" oninput="Friends.search(this.value)">
        </div>
      </div>

      <div class="tabs mb-4" id="friendsTabs">
        <button class="tab active" data-tab="requests" onclick="Friends.showTab('requests')">📥 Requests (<span id="reqCount">0</span>)</button>
        <button class="tab" data-tab="friends" onclick="Friends.showTab('friends')">👥 Friends (<span id="frCount">0</span>)</button>
        <button class="tab" data-tab="find" onclick="Friends.showTab('find')">🔍 Find People</button>
      </div>

      <div id="friendsContent"></div>
    </div>
  </main>
  <footer id="footer" class="footer"></footer>
  <div class="back-to-top">↑</div>
  <script src="js/data.js"></script><script src="js/utils.js"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/supabase-auth.js"></script><script src="js/supabase-sync.js"></script><script src="js/auth-system.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script><script src="js/weather.js"></script><script src="js/app.js"></script><script src="js/friends.js"></script>
  <script>
    App.init();
    Friends.init();
  </script>
  <script src="js/social-layout.js"></script>
</body>
</html>
