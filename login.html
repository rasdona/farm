<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login - Ekrishi Nepal</title>
  <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>
  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-brand">
            <span class="auth-brand-icon">🌱</span>
            <span>Ekrishi</span>
          </a>
          <h1 class="auth-title" data-en="Log In" data-ne="लगइन गर्नुहोस्">लगइन गर्नुहोस्</h1>
          <p class="auth-subtitle" data-en="Sign in with your email and password" data-ne="इमेल र पासवर्ड प्रयोग गरेर लगइन गर्नुहोस्">इमेल र पासवर्ड प्रयोग गरेर लगइन गर्नुहोस्</p>
        </div>

        <div id="loginError" class="auth-alert auth-alert-error hidden"></div>
        <div id="loginSuccess" class="auth-alert auth-alert-success hidden"></div>

        <form id="loginForm" class="auth-form" onsubmit="return handleLogin(event)">
          <div class="auth-input-group">
            <label class="auth-label" for="loginIdentifier" data-en="Email Address *" data-ne="इमेल ठेगाना *">इमेल ठेगाना <span class="required">*</span></label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon" id="inputTypeIcon">📧</span>
              <input type="email" class="auth-input" id="loginIdentifier" placeholder="तपाईंको इमेल ठेगाना" data-en-placeholder="Your email address" data-ne-placeholder="तपाईंको इमेल ठेगाना" required autocomplete="email" autofocus>
            </div>
            <div class="auth-input-hint" id="inputHint" data-en="Email and password login only" data-ne="केवल इमेल र पासवर्ड लगइन">केवल इमेल र पासवर्ड लगइन</div>
          </div>

          <div class="auth-input-group">
            <label class="auth-label" for="loginPassword" data-en="Password *" data-ne="पासवर्ड *">पासवर्ड <span class="required">*</span></label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">🔒</span>
              <input type="password" class="auth-input" id="loginPassword" placeholder="तपाईंको पासवर्ड" data-en-placeholder="Your password" data-ne-placeholder="तपाईंको पासवर्ड" required autocomplete="current-password">
              <button type="button" class="auth-toggle-pwd" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Show password">👁️</button>
            </div>
          </div>

          <div class="auth-row auth-mb-4">
            <label class="auth-check">
              <input type="checkbox" id="rememberMe">
              <span data-en="Remember me" data-ne="मलाई सम्झनुहोस्">मलाई सम्झनुहोस्</span>
            </label>
            <a href="forgot-password.html" class="auth-link" data-en="Forgot password?" data-ne="पासवर्ड बिर्सनुभयो?">पासवर्ड बिर्सनुभयो?</a>
          </div>

          <button type="submit" class="auth-btn auth-btn-primary auth-btn-lg" id="loginBtn">
            <span id="loginBtnText" data-en="Log In" data-ne="लगइन गर्नुहोस्">लगइन गर्नुहोस्</span>
            <span id="loginBtnLoader" class="auth-spinner hidden"></span>
          </button>
        </form>

        <div class="auth-divider"><span data-en="or" data-ne="वा">वा</span></div>

        <div class="auth-footer-links">
          <p class="auth-text-center"><span data-en="Don't have an account?" data-ne="खाता छैन?">खाता छैन?</span> <a href="register.html" class="auth-link-bold" data-en="Sign Up" data-ne="दर्ता गर्नुहोस्">दर्ता गर्नुहोस्</a></p>
          <p class="auth-text-center auth-mt-2"><a href="forgot-password.html" class="auth-link" data-en="Reset password" data-ne="पासवर्ड रिसेट गर्नुहोस्">पासवर्ड रिसेट गर्नुहोस्</a></p>
        </div>
      </div>
    </div>
  </main>
  <script src="js/data.js"></script><script src="js/utils.js"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/supabase-auth.js"></script><script src="js/supabase-sync.js"></script><script src="js/auth-system.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script><script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
