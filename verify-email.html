<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Email Verification - Ekrishi Nepal</title>
  <script>
    // Old magic-link verify-email page — redirect to OTP verification
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || sessionStorage.getItem('agri_pendingEmail') || '';
    if (email) {
      window.location.replace('verify-otp.html?type=email&email=' + encodeURIComponent(email));
    } else {
      window.location.replace('register.html');
    }
  </script>
</head>
<body>
  <p>Redirecting to OTP verification...</p>
</body>
</html>
