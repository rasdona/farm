name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths: [supabase/functions/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy all edge functions
        run: |
          for fn in _shared cleanup-otps delete-photo forgot-password get-verification-status login-user photo-status register-user request-contact-change resend-verification reset-password send-otp upload-photo verify-email-link verify-otp
          do
            if [ "$fn" = "_shared" ]; then continue; fi
            echo "Deploying $fn..."
            npx supabase functions deploy "$fn" --no-verify-jwt || echo "Warning: $fn deploy failed"
          done

      - name: Set Edge Function secrets
        run: |
          echo "${{ secrets.EMAIL_PROVIDER_API_KEY }}" | npx supabase secrets set EMAIL_PROVIDER_API_KEY
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
