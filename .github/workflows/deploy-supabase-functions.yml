name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
      - supabase/config.toml
      - supabase/migrations/**
      - .github/workflows/deploy-supabase-functions.yml

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: |
          echo "=== Applying migrations to ${{ secrets.SUPABASE_PROJECT_ID }} via Management API ==="
          python3 - <<'PY'
          import json, urllib.request, urllib.error, os, glob, sys

          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          ref = os.environ["SUPABASE_PROJECT_ID"]
          url = f"https://api.supabase.com/v1/projects/{ref}/database/query"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
          }

          files = sorted(glob.glob("supabase/migrations/*.sql"))
          if not files:
              print("No migration files found")
              sys.exit(1)

          for f in files:
              sql = open(f, encoding="utf-8").read()
              body = json.dumps({"query": sql}).encode()
              req = urllib.request.Request(url, data=body, headers=headers, method="POST")
              try:
                  urllib.request.urlopen(req, timeout=180).read()
                  print(f"OK   {f}")
              except urllib.error.HTTPError as e:
                  msg = e.read().decode(errors="replace")[:800]
                  print(f"FAIL {f} -> HTTP {e.code}: {msg}")
                  sys.exit(1)
              except Exception as e:
                  print(f"FAIL {f} -> {e}")
                  sys.exit(1)
          print("All migrations applied successfully")
          PY
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  deploy:
    needs: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: |
          fail=0
          for fn in cleanup-otps delete-photo forgot-password get-verification-status login-user photo-status register-user request-contact-change resend-verification reset-password send-otp upload-photo verify-email-link verify-otp
          do
            echo "Deploying $fn..."
            if ! supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --no-verify-jwt; then
              echo "ERROR: $fn deploy failed"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more functions failed to deploy"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Edge Function secrets
        run: |
          supabase secrets set EMAIL_PROVIDER_API_KEY="${{ secrets.EMAIL_PROVIDER_API_KEY }}" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase secrets set SMS_PROVIDER_API_KEY="${{ secrets.SMS_PROVIDER_API_KEY }}" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase secrets set SMS_SENDER_ID="${{ secrets.SMS_SENDER_ID || 'AgriConnect' }}" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase secrets set EMAIL_FROM="${{ secrets.EMAIL_FROM || 'AgriConnect Nepal <noreply@agriconnect.com.np>' }}" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase secrets set APP_URL="${{ secrets.APP_URL || 'https://agriconnect.com.np' }}" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase secrets set RECAPTCHA_SECRET="${{ secrets.RECAPTCHA_SECRET }}" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase secrets set OTP_DEV_MODE="${{ secrets.OTP_DEV_MODE || 'false' }}" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase secrets set CRON_SECRET="${{ secrets.CRON_SECRET }}" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
