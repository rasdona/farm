<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Page Not Found - AgriConnect Nepal</title>
  <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
  <style>
    .nf-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 180px);text-align:center;padding:40px 20px}
    .nf-code{font-size:8rem;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px}
    .nf-title{font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:8px}
    .nf-sub{color:var(--text-secondary);margin-bottom:32px;max-width:400px;line-height:1.5}
    .nf-icon{font-size:5rem;margin-bottom:24px;opacity:0.7}
    .nf-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .nf-search{display:flex;gap:8px;margin-top:32px;max-width:400px;width:100%}
    .nf-search input{flex:1;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-full);font-size:0.95rem;outline:none}
    .nf-search input:focus{border-color:var(--primary)}
    @media(max-width:768px){.nf-code{font-size:5rem}.nf-icon{font-size:3.5rem}.nf-actions{flex-direction:column;width:100%}.nf-actions .btn{width:100%}}
  </style>
</head>
<body>
  <header id="navbar" class="navbar"></header>
  <main style="margin-top:var(--navbar-height)">
    <div class="nf-page">
      <div class="nf-icon">🌾</div>
      <div class="nf-code">404</div>
      <h1 class="nf-title">Page Not Found</h1>
      <p class="nf-sub">Looks like this page wandered off the farm. The page you're looking for doesn't exist or has been moved.</p>
      <div class="nf-actions">
        <a href="index.html" class="btn btn-primary btn-pill btn-lg">🏠 Go Home</a>
        <a href="javascript:history.back()" class="btn btn-outline btn-pill btn-lg">← Go Back</a>
        <a href="marketplace.html" class="btn btn-outline btn-pill btn-lg">🛒 Browse Marketplace</a>
      </div>
      <div class="nf-search">
        <input type="text" id="nfSearch" placeholder="Search AgriConnect..." onkeydown="if(event.key==='Enter')window.location.href='marketplace.html?q='+encodeURIComponent(this.value)">
        <button class="btn btn-primary btn-pill" onclick="window.location.href='marketplace.html?q='+encodeURIComponent(document.getElementById('nfSearch').value)">Search</button>
      </div>
    </div>
  </main>
  <footer id="footer" class="footer"></footer>
  <script src="js/data.js"></script><script src="js/utils.js"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/supabase-auth.js"></script><script src="js/auth-system.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script><script src="js/app.js"></script>
  <script>App.init();</script>
</body>
</html>
