<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>OTP सत्यापन - AgriConnect Nepal</title>
  <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>
  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-brand">
            <span class="auth-brand-icon">🌱</span>
            <span>AgriConnect</span>
          </a>
          <div class="auth-otp-icon">✉️</div>
          <h1 class="auth-title">इमेल OTP सत्यापन</h1>
          <p class="auth-subtitle" id="otpSubtitle">तपाईंको इमेलमा ६ अंकको कोड पठाइएको छ</p>
          <p class="auth-phone-display" id="otpEmail"></p>
        </div>

        <div id="otpError" class="auth-alert auth-alert-error hidden"></div>
        <div id="otpSuccess" class="auth-alert auth-alert-success hidden"></div>

        <form id="otpForm" class="auth-form" onsubmit="return handleOtpVerify(event)">
          <div class="auth-otp-inputs" id="otpInputs">
            <input type="text" class="auth-otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-otp="0" autofocus>
            <input type="text" class="auth-otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-otp="1">
            <input type="text" class="auth-otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-otp="2">
            <input type="text" class="auth-otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-otp="3">
            <input type="text" class="auth-otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-otp="4">
            <input type="text" class="auth-otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-otp="5">
          </div>

          <button type="submit" class="auth-btn auth-btn-primary auth-btn-lg auth-btn-block auth-mt-4" id="otpVerifyBtn">
            <span id="otpBtnText">सत्यापन गर्नुहोस्</span>
            <span id="otpBtnLoader" class="auth-spinner hidden"></span>
          </button>
        </form>

        <div class="auth-mt-4 auth-text-center">
          <p class="auth-text-muted">कोड आएन?</p>
          <button type="button" class="auth-btn auth-btn-ghost auth-mt-2" id="resendBtn" onclick="resendOtp()" disabled>
            <span id="resendText">पुन: पठाउनुहोस् (६० सेकेन्ड)</span>
          </button>
        </div>

        <div class="auth-mt-4 auth-text-center">
          <a href="login.html" class="auth-link">← लगइन पेजमा फर्कनुहोस्</a>
        </div>
      </div>
    </div>
  </main>
  <script src="js/data.js"></script><script src="js/utils.js"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/supabase-auth.js"></script><script src="js/email-service.js"></script><script src="js/supabase-sync.js"></script><script src="js/auth-system.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script><script src="js/app.js"></script>
  <script>
    let resendTimer = null;
    let attemptCount = 0;
    const maxAttempts = 5;
    const OTP_SEND_WINDOW_MS = 90000;
    const otpType = new URLSearchParams(window.location.search).get('type') || 'email';
    const otpEmail = new URLSearchParams(window.location.search).get('email') || '';
    const hasPendingRegistration = (() => {
      try { return !!sessionStorage.getItem('agri_pendingRegistration'); } catch (e) { return false; }
    })();

    document.addEventListener('DOMContentLoaded', function() {
      App.init();
      if (!otpEmail) {
        showOtpError('इमेल ठेगाना फेला भएन। कृपया दर्ता फेरि गर्नुहोस्।');
        document.getElementById('otpVerifyBtn').disabled = true;
        return;
      }
      document.getElementById('otpEmail').textContent = otpEmail;
      setupOtpInputs();
      if (otpType === 'email') {
        autoSendOtp();
      } else {
        startResendTimer();
      }
    });

    function getLastOtpSent() {
      try {
        const raw = sessionStorage.getItem('agri_otpSent');
        if (!raw) return null;
        const data = JSON.parse(raw);
        return data && data.email === otpEmail ? data : null;
      } catch (e) { return null; }
    }

    function recordOtpSent() {
      try { sessionStorage.setItem('agri_otpSent', JSON.stringify({ email: otpEmail, at: Date.now() })); } catch (e) {}
    }

    async function autoSendOtp() {
      const last = getLastOtpSent();
      if (last) {
        const elapsed = Date.now() - last.at;
        if (elapsed < OTP_SEND_WINDOW_MS) {
          startResendTimer(Math.max(10, Math.ceil((OTP_SEND_WINDOW_MS - elapsed) / 1000)));
          return;
        }
      }

      document.getElementById('otpSubtitle').textContent = 'नयाँ कोड तपाईंको इमेलमा पठाइँदैछ...';
      showOtpLoading(true);
      try {
        const result = await EmailService.sendEmailOtp(otpEmail, 'email_verify');
        showOtpLoading(false);
        if (result.success) {
          recordOtpSent();
          document.getElementById('otpSubtitle').textContent = 'तपाईंको इमेलमा ६ अंकको कोड पठाइएको छ';
          startResendTimer();
        } else {
          const errMsg = (result.data && result.data.error) || result.message || 'कोड पठाउन असफल';
          showOtpError('कोड पठाउन असफल: ' + errMsg);
          startResendTimer(10);
        }
      } catch (err) {
        showOtpLoading(false);
        showOtpError('नेटवर्क त्रुटि। कोड पठाउन असफल भयो। फेरि प्रयास गर्नुहोस्।');
        startResendTimer(10);
      }
    }

    function setupOtpInputs() {
      const inputs = document.querySelectorAll('.auth-otp-input');
      inputs.forEach((input, i) => {
        input.addEventListener('input', function() {
          this.value = this.value.replace(/[^0-9]/g, '');
          if (this.value && i < inputs.length - 1) inputs[i + 1].focus();
          if (i === inputs.length - 1 && this.value) verifyOtp();
        });
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Backspace' && !this.value && i > 0) { inputs[i - 1].focus(); inputs[i - 1].value = ''; }
          if (e.key === 'Enter') { e.preventDefault(); verifyOtp(); }
        });
        input.addEventListener('paste', function(e) {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
          pasted.split('').forEach((char, j) => { if (inputs[j]) inputs[j].value = char; });
          if (pasted.length > 0) inputs[Math.min(pasted.length, inputs.length) - 1].focus();
          if (pasted.length === 6) setTimeout(verifyOtp, 100);
        });
      });
    }

    function getOtpValue() {
      return Array.from(document.querySelectorAll('.auth-otp-input')).map(i => i.value).join('');
    }

    async function handleOtpVerify(e) {
      e.preventDefault();
      await verifyOtp();
    }

    async function verifyOtp() {
      const otp = getOtpValue();
      if (otp.length !== 6) return;
      if (attemptCount >= maxAttempts) {
        showOtpError('धेरै पटक प्रयास भयो। कृपया पुन: पठाउनुहोस् वा दर्ता फेरि गर्नुहोस्।');
        return;
      }

      showOtpLoading(true);
      try {
        if (otpType === 'password_reset') {
          const result = AuthSystem.verifyPasswordResetOtp(sessionStorage.getItem('agri_resetUserId'), otp);
          showOtpLoading(false);
          if (result.success) {
            showOtpSuccess('सत्यापन सफल भयो!');
            setTimeout(() => { window.location.href = 'forgot-password.html?step=newpassword'; }, 1000);
          } else {
            attemptCount++;
            showOtpError(result.message || 'गलत कोड। फेरि प्रयास गर्नुहोस्।');
            clearOtpInputs();
          }
        } else {
          // Email OTP — verify via Edge Function
          const result = await EmailService.verifyEmailOtp(otpEmail, otp, 'email_verify');
          showOtpLoading(false);

          if (!result.success) {
            const errMsg = (result.data && result.data.message) || result.message || 'सत्यापन असफल';
            const data = result.data || {};
            if (data.locked) {
              showOtpError('धेरै पटक प्रयास भयो। केही समय पर्खनुहोस्।');
            } else if (errMsg.includes('expired')) {
              showOtpError('कोडको म्याद सकिएको छ। नयाँ कोड पठाउनुहोस्।');
            } else if (errMsg.includes('invalid') || errMsg.includes('Incorrect')) {
              attemptCount++;
              showOtpError('गलत कोड। फेरि प्रयास गर्नुहोस्। (' + attemptCount + '/' + maxAttempts + ')');
            } else {
              showOtpError('सत्यापन असफल: ' + errMsg);
            }
            clearOtpInputs();
          } else {
            if (hasPendingRegistration) {
              showOtpSuccess('इमेल सत्यापन सफल भयो! प्रोफाइल तयार हुँदैछ...');
              document.getElementById('otpVerifyBtn').disabled = true;
              document.getElementById('otpBtnText').textContent = 'प्रोफाइल तयार हुँदैछ...';

              let completeResult;
              try {
                const COMPLETION_TIMEOUT_MS = 60000;
                const completionPromise = AuthSystem.completeRegistrationAfterOtp();
                const timeoutPromise = new Promise((_, reject) =>
                  setTimeout(() => reject(new Error('COMPLETION_TIMEOUT')), COMPLETION_TIMEOUT_MS)
                );
                completeResult = await Promise.race([completionPromise, timeoutPromise]);
              } catch (completionErr) {
                console.error('[OTP] completeRegistrationAfterOtp error:', completionErr);
                completeResult = { success: false, message: completionErr.message || 'Profile completion failed' };
              }

              if (completeResult.success) {
                try { sessionStorage.removeItem('agri_pendingPhoto'); } catch (e) {}
                showOtpSuccess('दर्ता पूरा भयो! ड्यासबोर्डमा लगिँदैछ...');
                setTimeout(() => { window.location.href = Auth.getDashboardUrl(); }, 1200);
              } else {
                if (completeResult.message && completeResult.message.includes('timed out')) {
                  showOtpError('Profile picture upload failed. Your account was created. Please log in and upload a photo from settings.');
                } else {
                  showOtpSuccess('इमेल सत्यापन भयो, तर प्रोफाइल सेभ गर्दा समस्या भयो। लगइन गर्नुहोस्।');
                }
                setTimeout(() => { window.location.href = 'login.html'; }, 2500);
              }
            } else {
              // Existing account (login flow): email is now confirmed, so login will succeed.
              showOtpSuccess('इमेल सत्यापन सफल भयो! अब लगइन गर्नुहोस्।');
              setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            }
          }
        }
      } catch (err) {
        showOtpLoading(false);
        showOtpError('नेटवर्क त्रुटि। कृपया इन्टरनेट जाँच गर्नुहोस् र फेरि प्रयास गर्नुहोस्।');
        clearOtpInputs();
      }
    }

    async function resendOtp() {
      if (!otpEmail) return;

      if (otpType === 'password_reset') {
        const user = DB.getUserByEmail(otpEmail);
        if (!user) { showOtpError('यो इमेलमा खाता फेला भएन।'); return; }
        showOtpLoading(true);
        const result = await AuthSystem.sendPasswordResetOtp(user.phone);
        showOtpLoading(false);
        if (result && result.success) {
          showOtpSuccess('नयाँ OTP पठाइयो!');
          startResendTimer();
        } else {
          showOtpError(result?.message || 'OTP पठाउन असफल भयो।');
        }
      } else {
        // Email OTP — resend via Edge Function
        showOtpLoading(true);
        try {
          const result = await EmailService.resendOtp(otpEmail, 'email_verify');
          showOtpLoading(false);
          if (result.success) {
            recordOtpSent();
            showOtpSuccess('नयाँ OTP कोड ' + otpEmail + ' मा पठाइयो!');
            attemptCount = 0;
            startResendTimer();
          } else {
            showOtpError('OTP पठाउन असफल: ' + (result.message || 'अज्ञात त्रुटि'));
          }
        } catch (err) {
          showOtpLoading(false);
          showOtpError('नेटवर्क त्रुटि। कृपया फेरि प्रयास गर्नुहोस्।');
        }
      }
    }

    function startResendTimer(initialSeconds) {
      let sec = initialSeconds || 60;
      const btn = document.getElementById('resendBtn');
      const text = document.getElementById('resendText');
      btn.disabled = true;
      if (resendTimer) clearInterval(resendTimer);
      resendTimer = setInterval(() => {
        sec--;
        text.textContent = 'पुन: पठाउनुहोस् (' + sec + ' सेकेन्ड)';
        if (sec <= 0) { clearInterval(resendTimer); btn.disabled = false; text.textContent = 'पुन: पठाउनुहोस्'; }
      }, 1000);
    }

    function clearOtpInputs() {
      document.querySelectorAll('.auth-otp-input').forEach(i => { i.value = ''; });
      document.querySelector('.auth-otp-input').focus();
    }

    function showOtpError(msg) {
      const el = document.getElementById('otpError');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('otpSuccess').classList.add('hidden');
    }
    function showOtpSuccess(msg) {
      const el = document.getElementById('otpSuccess');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('otpError').classList.add('hidden');
    }
    function showOtpLoading(show) {
      document.getElementById('otpVerifyBtn').disabled = show;
      document.getElementById('otpBtnText').textContent = show ? 'सत्यापन हुँदैछ...' : 'सत्यापन गर्नुहोस्';
      document.getElementById('otpBtnLoader').classList.toggle('hidden', !show);
    }
  </script>
</body>
</html>
