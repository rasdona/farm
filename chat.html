<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Messages - Ekrishi Nepal</title>
  <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>
  <div class="chat-layout">
    <aside class="chat-sidebar">
      <div class="chat-sidebar-header">
        <h3>Messages <span id="chatSidebarBadge" class="badge-count" style="display:none;position:relative;top:-1px"></span></h3>
        <div class="chat-sidebar-search">
          <span class="icon">🔍</span>
          <input type="text" id="chatSearch" placeholder="Search conversations..." oninput="Chat.renderContacts()">
        </div>
      </div>
      <div class="chat-contacts" id="chatContacts"></div>
    </aside>
    <main class="chat-main">
      <div class="chat-header" id="chatHeader">
        <div class="empty-state" style="flex:1;padding:20px"><p class="text-muted">Select a conversation to start chatting</p></div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-media-preview" id="chatMediaPreview" style="display:none">
        <div id="chatMediaHolder"></div>
        <span class="chat-media-name" id="chatMediaName"></span>
        <button class="btn btn-ghost btn-sm" onclick="Chat.removeMedia()" style="margin-left:auto">✕ Remove</button>
      </div>
      <div class="chat-input-area">
        <label class="chat-attach-btn" title="Attach photo or video" style="cursor:pointer">📎<input type="file" accept="image/*,video/*" style="display:none" onchange="Chat.attachMedia(this)"></label>
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter'){Chat.sendMessage(this.value);event.preventDefault();}">
        <button class="chat-send-btn" onclick="Chat.sendMessage(document.getElementById('chatInput').value)">➤</button>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script><script src="js/utils.js"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/supabase-auth.js"></script><script src="js/supabase-sync.js"></script><script src="js/auth-system.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script><script src="js/weather.js"></script><script src="js/app.js"></script><script src="js/chat.js"></script>
  <script>
    App.init();
    if (!Auth.requireProfilePhoto()) { /* redirected */ }
    else { Chat.renderChatPage(); }
  </script>
  <script src="js/social-layout.js"></script>
</body>
</html>
